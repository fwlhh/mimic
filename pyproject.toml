[project]
name = "mimic"
version = "0.1.0"
description = "Lightweight port spoofer for disguising servers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }

[tool.ruff]
line-length = 79
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line length enforced by formatter
]

[tool.ruff.lint.per-file-ignores]
"signatures.py" = ["E501"]  # HTML/JSON bodies